site_name: structural_engineering_lib
site_description: Case-qualified IS 456 reinforced-concrete design library and workbench
# No public site URL is declared while GitHub Pages remains owner-configured and
# unverified. Restore one only after the owner enables Pages and verifies it.
repo_url: https://github.com/Pravin-surawase/structural_engineering_lib
repo_name: Pravin-surawase/structural_engineering_lib

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags
  - mkdocstrings:
      handlers:
        python:
          paths: [Python]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            docstring_options:
              warn_unknown_params: false

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

# Exclude internal/archived directories from the published site.
# These contain stale cross-references that break --strict builds.
# README.md files are excluded where index.md already exists (avoids conflicts).
exclude_docs: |
  _archive/**
  _active/**
  _internal/**
  README.md
  **/README.md

# Prevent --strict from failing on non-critical link issues in docs.
# nav.not_found remains 'warn' so missing nav targets still error.
validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: info
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: info
    absolute_links: info
    unrecognized_links: info
    anchors: info

nav:
  - Home: index.md
  - Getting Started:
    - Product Tour: getting-started/product-tour.md
    - Quick Start (Python): getting-started/python-quickstart.md
    - Beam Workflow: getting-started/user-guide.md
    - Google Colab: getting-started/colab-workflow.md
    - Installation Notes: getting-started/installation-notes.md
    - Beginner's Guide: getting-started/beginners-guide.md
    - Current Release: getting-started/release-status.md
    - Mac Setup: getting-started/mac-mini-setup.md
  - Guides:
    - CLI Cookbook: cookbook/cli-reference.md
    - Cost Optimization: getting-started/cost-optimization-guide.md
    - Design Suggestions: getting-started/design-suggestions-guide.md
    - ETABS API Integration: guides/etabs-api-integration.md
    - Insights (experimental): getting-started/insights-guide.md
  - Reference:
    - API Reference: reference/api.md
    - Family Facade Contracts: reference/family-facade-contracts.md
    - Family Facade Cookbook: cookbook/python/family-facades.md
    - IS 456 Formulas: reference/is456-formulas.md
    - Error Codes: reference/error-codes.md
    - Troubleshooting: reference/troubleshooting.md
  - Architecture:
    - Overview: architecture/project-overview.md
    - Data Flow: architecture/data-flow-diagrams.md
    - Dependencies: architecture/dependencies.md
  - Contributing:
    - Agent Bootstrap: getting-started/agent-bootstrap.md
    - Copilot Agents: guides/copilot-agents-usage-guide.md
    - Development Guide: contributing/development-guide.md
    - Testing Strategy: contributing/testing-strategy.md
    - Code Standards: contributing/agent-coding-standards.md
    - Release Ledger: getting-started/releases.md
  - API Docs:
    - structural_lib: api-reference/index.md
