name: Weekly Verification

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      cross_platform:
        description: 'Also run the macOS and Windows Python smoke matrix'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-verification:
    name: Full Python, FastAPI, and React verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Python/pyproject.toml
            requirements*.txt

      - name: Install Python and FastAPI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'Python/[dev,dxf,report]'
          python -m pip install -r requirements.txt

      - name: Python format, lint, and types
        working-directory: Python
        run: |
          python -m black --check .
          python -m ruff check .
          python -m mypy

      - name: FastAPI format and lint
        run: |
          python -m black --check fastapi_app
          python -m ruff check fastapi_app

      - name: Full Python suite with coverage
        working-directory: Python
        run: |
          STRUCTURAL_LIB_PYTHON="$(command -v python)" python -m pytest tests -q --hypothesis-profile=ci \
            --cov=structural_lib --cov-branch --cov-report=term-missing \
            --cov-fail-under=85

      - name: FastAPI suite and contracts
        run: |
          python -m pytest fastapi_app/tests -q --tb=short
          python scripts/validate_api_contracts.py
          python scripts/check_openapi_drift.py

      - name: FastAPI benchmark evidence (scheduled/manual lane)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/benchmark_api.py --mode fastapi --quick --output json --save docs/reference/fastapi-benchmark-report.json

      - name: Upload API benchmark evidence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: fastapi-benchmark-lane-${{ github.run_id }}
          path: docs/reference/fastapi-benchmark-report.json

      - name: Documentation and repository drift
        run: |
          python scripts/check_doc_versions.py --ci
          python scripts/check_docs.py --index
          python scripts/check_docs.py --index-links
          python scripts/check_links.py
          python scripts/check_api.py --sync
          python scripts/check_api.py --docs
          python scripts/generate_api_manifest.py --check
          python scripts/generate_enhanced_index.py --all --check
          python scripts/check_architecture_boundaries.py
          python scripts/release.py check-docs
          python scripts/release.py checklist
          python scripts/session.py check
          python scripts/check_next_session_brief_length.py
          python scripts/check_cli_reference.py

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react_app/package-lock.json

      - name: React lint, build, and tests
        working-directory: react_app
        run: |
          npm ci
          npm run lint
          npm run build
          npx vitest run

  package-verification:
    name: Clean wheel and CLI verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python/pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir Python/dist Python

      - name: Verify exact wheel in an isolated environment
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('Python/pyproject.toml','rb'))['project']['version'])")
          python scripts/release.py verify \
            --source wheel \
            --wheel-dir Python/dist \
            --version "$package_version"

      - name: Upload verified wheel
        uses: actions/upload-artifact@v7
        with:
          name: weekly-verified-wheel
          path: Python/dist/*.whl
          retention-days: 30

  dependency-audit:
    name: Locked dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Audit locked Python dependencies
        run: |
          python -m pip install 'pip-audit>=2.9,<3'
          pip-audit --strict --no-deps --requirement requirements-lock.txt \
            --format json --output pip-audit-report.json

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react_app/package-lock.json

      - name: Audit production npm dependencies
        working-directory: react_app
        run: |
          npm ci
          set +e
          npm audit --omit=dev --json > npm-audit-report.json
          audit_status=$?
          set -e

          total=$(jq -r '.metadata.vulnerabilities.total // 0' npm-audit-report.json)
          unexpected_packages=$(jq -r \
            '[.vulnerabilities | keys[]? | select(. != "react-router" and . != "react-router-dom")] | join(",")' \
            npm-audit-report.json)
          unexpected_advisories=$(jq -r \
            '[.vulnerabilities[]?.via[]? | select(type == "object") | .url | select(. != "https://github.com/advisories/GHSA-qwww-vcr4-c8h2")] | unique | join(",")' \
            npm-audit-report.json)
          advisory_count=$(jq -r \
            '[.vulnerabilities[]?.via[]? | select(type == "object") | .url] | unique | length' \
            npm-audit-report.json)

          if [[ -n "$unexpected_packages" || -n "$unexpected_advisories" ]]; then
            echo "Unexpected npm vulnerability: packages=$unexpected_packages advisories=$unexpected_advisories"
            exit 1
          fi
          if [[ "$total" -gt 0 && "$advisory_count" -eq 0 ]]; then
            echo 'npm reported vulnerabilities without an auditable advisory URL'
            exit 1
          fi
          if [[ "$audit_status" -ne 0 && "$total" -eq 0 ]]; then
            echo 'npm audit failed without reporting a vulnerability'
            exit 1
          fi

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-dependency-audits
          path: |
            pip-audit-report.json
            react_app/npm-audit-report.json
          retention-days: 30

  docker-verification:
    name: Docker build and health verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.fastapi
          push: false
          load: true
          tags: structural-lib-weekly:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify health and readiness
        run: |
          container_name="structural-lib-weekly-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$container_name" -p 8000:8000 \
            "structural-lib-weekly:${GITHUB_RUN_ID}"

          healthy=false
          for attempt in {1..20}; do
            if curl -fsS http://localhost:8000/health >/dev/null && \
               curl -fsS http://localhost:8000/health/ready >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != 'true' ]]; then
            docker logs "$container_name"
            exit 1
          fi

      - name: Validate Compose configuration
        env:
          JWT_SECRET_KEY: weekly-verification-secret
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

  cross-platform:
    name: ${{ matrix.os }} Python 3.12 smoke
    if: github.event_name == 'workflow_dispatch' && inputs.cross_platform
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "Python/[dev,dxf]"

      - name: Run cross-platform suite
        run: python -m pytest Python/tests -q -m "not slow and not performance"

  summary:
    name: Weekly Verification Summary
    if: always()
    needs:
      - full-verification
      - package-verification
      - dependency-audit
      - docker-verification
      - cross-platform
    runs-on: ubuntu-latest
    steps:
      - name: Report and enforce job conclusions
        env:
          FULL_RESULT: ${{ needs.full-verification.result }}
          PACKAGE_RESULT: ${{ needs.package-verification.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-audit.result }}
          DOCKER_RESULT: ${{ needs.docker-verification.result }}
          CROSS_RESULT: ${{ needs.cross-platform.result }}
          CROSS_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.cross_platform }}
        run: |
          {
            echo '## Weekly verification results'
            echo "- Full Python/FastAPI/React: $FULL_RESULT"
            echo "- Clean wheel and CLI: $PACKAGE_RESULT"
            echo "- Dependency audits: $DEPENDENCY_RESULT"
            echo "- Docker build and health: $DOCKER_RESULT"
            echo "- Optional cross-platform: $CROSS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$FULL_RESULT" "$PACKAGE_RESULT" "$DEPENDENCY_RESULT" "$DOCKER_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              failed=1
            fi
          done
          if [[ "$CROSS_REQUESTED" == 'true' && "$CROSS_RESULT" != 'success' ]]; then
            failed=1
          fi
          if [[ "$CROSS_REQUESTED" != 'true' && "$CROSS_RESULT" != 'skipped' ]]; then
            failed=1
          fi
          exit "$failed"
