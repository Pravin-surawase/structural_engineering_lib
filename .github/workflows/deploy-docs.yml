name: Validate Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'Python/pyproject.toml'
      - 'Python/structural_lib/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'Python/pyproject.toml'
      - 'Python/structural_lib/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for git-revision-date

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install "mkdocs-material>=9.5,<10" "mkdocstrings[python]>=0.25,<1"
          pip install -e Python/

      # GitHub Pages is intentionally owner-configured. Until its settings and
      # deployed URL are verified, this workflow provides build evidence only.
      - name: Build documentation strictly
        run: mkdocs build --strict
