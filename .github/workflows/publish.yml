name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version to publish to TestPyPI'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: Python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Resolve and verify requested version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version || '' }}
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            requested_version="${GITHUB_REF_NAME#v}"
          else
            requested_version="$MANUAL_VERSION"
          fi
          if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $requested_version"
            exit 1
          fi
          if [[ "$requested_version" != "$package_version" ]]; then
            echo "Requested version $requested_version does not match package version $package_version"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Run release tests
        run: python -m pytest tests -q --tb=short

  build:
    name: Build and verify distributions
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine 'cyclonedx-bom>=7,<8'
          python -m build
          python -m twine check dist/*

      - name: Install and import the built wheel
        run: |
          mapfile -t wheels < <(find dist -maxdepth 1 -name '*.whl' -print)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          python -m pip install --force-reinstall "${wheels[0]}[dev]"
          python -c 'from structural_lib import api; print(api.get_library_version())'

      - name: Generate and validate CycloneDX SBOM
        run: |
          mkdir -p release-assets
          cyclonedx-py environment \
            --output-file release-assets/sbom.json \
            --output-format JSON \
            --spec-version 1.6
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('release-assets/sbom.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('bomFormat') == 'CycloneDX'
          assert data.get('specVersion') == '1.6'
          assert isinstance(data.get('components'), list) and data['components']
          print(f"Validated SBOM with {len(data['components'])} components")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: Python/dist/

      - name: Upload release SBOM
        uses: actions/upload-artifact@v7
        with:
          name: release-sbom
          path: Python/release-assets/sbom.json

  publish-testpypi:
    name: Publish ${{ needs.validate.outputs.version }} to TestPyPI
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/structural-lib-is456
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish ${{ needs.validate.outputs.version }} to PyPI
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/structural-lib-is456
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [validate, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: release-sbom
          path: release-assets/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            release-assets/sbom.json
          generate_release_notes: true
          draft: false
