name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version to publish to TestPyPI'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: Python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,validation]' 'httpx>=0.27'

      - name: Resolve and verify requested version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version || '' }}
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            requested_version="${GITHUB_REF_NAME#v}"
          else
            requested_version="$MANUAL_VERSION"
          fi
          if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+a[0-9]+$ ]]; then
            echo "Invalid Alpha release version: $requested_version"
            echo "Expected PEP 440 Alpha format X.Y.ZaN (for example, 0.24.0a1)"
            exit 1
          fi
          if [[ "$requested_version" != "$package_version" ]]; then
            echo "Requested version $requested_version does not match package version $package_version"
            exit 1
          fi
          prerelease=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              classifiers = tomllib.load(stream)["project"].get("classifiers", [])

          assert "Development Status :: 3 - Alpha" in classifiers
          print("true")
          PY
          )
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify public-distribution permission
        run: python ../scripts/release.py permission-check

      - name: Verify complete footing release inclusion
        run: python ../scripts/release.py footing-inclusion-check

      - name: Enforce separate owner publication authorization
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python ../scripts/release.py authorization-check --version "$RELEASE_VERSION" --target testpypi
          else
            python ../scripts/release.py authorization-check --version "$RELEASE_VERSION" --target pypi
            python ../scripts/release.py authorization-check --version "$RELEASE_VERSION" --target github-release
          fi

      - name: Run release tests
        run: STRUCTURAL_LIB_PYTHON="$(command -v python)" python -m pytest tests -q --tb=short

  build:
    name: Build and verify distributions
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine 'cyclonedx-bom>=7,<8'
          python -m build
          python -m twine check dist/*

      - name: Verify distribution contents and record artifact identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          artifacts = sorted(path for path in dist.iterdir() if path.is_file())
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"

          forbidden = (
              "structural_lib/_migration_fixtures/",
              "structural_lib/research/",
              "structural_lib/codes/aci318/",
              "structural_lib/codes/ec2/",
              "tests/",
              "examples/",
              "scripts/",
              "docs/",
          )
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_files = sorted(archive.namelist())
              leaked = [name for name in wheel_files if name.startswith(forbidden)]
              assert not leaked, f"forbidden wheel content: {leaked}"
              clause_name = next(
                  name for name in wheel_files if name.endswith("codes/is456/clauses.json")
              )
              clause_data = json.loads(archive.read(clause_name))
              assert clause_data["metadata"]["protected_standard_text_included"] is False
              assert clause_data["metadata"]["protected_table_values_included"] is False
              serialized = json.dumps(clause_data)
              assert '"text"' not in serialized and '"data"' not in serialized

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_files = sorted(member.name for member in archive.getmembers())
              leaked = [
                  name
                  for name in sdist_files
                  if any(f"/{prefix}" in name for prefix in forbidden)
              ]
              assert not leaked, f"forbidden sdist content: {leaked}"

          release_assets = Path("release-assets")
          release_assets.mkdir(exist_ok=True)
          (release_assets / "wheel-inventory.txt").write_text(
              "\n".join(wheel_files) + "\n", encoding="utf-8"
          )
          (release_assets / "sdist-inventory.txt").write_text(
              "\n".join(sdist_files) + "\n", encoding="utf-8"
          )
          manifest = {
              "schema_version": "release-artifact-evidence/v2",
              "package_version": next(
                  path.name.split("-")[1]
                  for path in wheels
              ),
              "source_sha": os.environ["SOURCE_SHA"],
              "source_ref": os.environ["SOURCE_REF"],
              "artifacts": [
                  {
                      "filename": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "size_bytes": path.stat().st_size,
                  }
                  for path in artifacts
              ],
              "content_allowlist_passed": True,
              "protected_content_gate_passed": True,
              "public_distribution_permission_record": {
                  "record_id": "IS456-PUBLIC-DISTRIBUTION-001",
                  "decision": "AUTHORIZED",
                  "sha256": hashlib.sha256(
                      Path(
                          "../docs/verification/"
                          "is456-public-distribution-permission.json"
                      ).read_bytes()
                  ).hexdigest(),
              },
              "public_distribution_permission_gate_passed": True,
              "footing_release_inclusion": {
                  "record_id": "FOOT-ISO-RC-V1-RELEASE-INCLUSION",
                  "source_head": "886871aef93d9a955a3cc2fa613fe49bad589ce7",
                  "sha256": hashlib.sha256(
                      Path(
                          "../docs/verification/footing-release-inclusion.json"
                      ).read_bytes()
                  ).hexdigest(),
              },
              "footing_release_inclusion_gate_passed": True,
          }
          (release_assets / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Clean-environment UAT on the exact built wheel
        run: |
          mapfile -t wheels < <(find dist -maxdepth 1 -name '*.whl' -print)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          uat_root="$(mktemp -d)"
          test -n "$uat_root"
          python -m venv "$uat_root/venv"
          "$uat_root/venv/bin/python" -m pip install --upgrade pip
          "$uat_root/venv/bin/python" -m pip install "${wheels[0]}"
          (
            cd "$uat_root"
            "$uat_root/venv/bin/python" -m structural_lib.release_uat \
              --require-installed-wheel \
              --output "$GITHUB_WORKSPACE/Python/release-assets/exact-wheel-uat.json"
            "$uat_root/venv/bin/python" -m structural_lib --help >/dev/null
            "$uat_root/venv/bin/python" -m structural_lib install-preflight --json \
              > "$GITHUB_WORKSPACE/Python/release-assets/install-preflight.json"
          )

      - name: Generate and validate CycloneDX SBOM
        run: |
          mkdir -p release-assets
          cyclonedx-py environment \
            --output-file release-assets/sbom.json \
            --output-format JSON \
            --spec-version 1.6
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('release-assets/sbom.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('bomFormat') == 'CycloneDX'
          assert data.get('specVersion') == '1.6'
          assert isinstance(data.get('components'), list) and data['components']
          print(f"Validated SBOM with {len(data['components'])} components")
          PY

      - name: Finalize immutable release evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          assets = Path("release-assets")
          manifest_path = assets / "artifact-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          uat_path = assets / "exact-wheel-uat.json"
          uat = json.loads(uat_path.read_text(encoding="utf-8"))
          assert uat["status"] == "PASS"
          assert uat["professional_approval"] is False
          authorization_path = Path(
              "../docs/verification/release-publication-authorization.json"
          )
          authorization = json.loads(authorization_path.read_text(encoding="utf-8"))
          assert authorization["decision"] == "AUTHORIZED"
          assert authorization["version"] == manifest["package_version"]
          review_receipt_path = Path("..") / authorization[
              "exact_candidate_review_receipt"
          ]
          review_receipt = json.loads(
              review_receipt_path.read_text(encoding="utf-8")
          )
          review_receipt_sha256 = hashlib.sha256(
              review_receipt_path.read_bytes()
          ).hexdigest()
          assert review_receipt_sha256 == authorization[
              "exact_candidate_review_receipt_sha256"
          ]
          assert review_receipt["decision"] == "ACCEPT"

          manifest.update(
              {
                  "source_tree_sha": subprocess.check_output(
                      ["git", "rev-parse", "HEAD^{tree}"], text=True
                  ).strip(),
                  "workflow": {
                      "run_id": os.environ["RUN_ID"],
                      "run_attempt": os.environ["RUN_ATTEMPT"],
                      "source_sha": os.environ["SOURCE_SHA"],
                      "source_ref": os.environ["SOURCE_REF"],
                  },
                  "exact_wheel_uat": {
                      "status": uat["status"],
                      "receipt_sha256": hashlib.sha256(uat_path.read_bytes()).hexdigest(),
                      "matrix_schema_version": uat["matrix_schema_version"],
                      "matrix_sha256": uat["matrix_sha256"],
                      "case_count": uat["case_count"],
                      "library_content_identity": uat["library_content_identity"],
                      "public_examples": uat["public_examples"],
                  },
                  "install_preflight_sha256": hashlib.sha256(
                      (assets / "install-preflight.json").read_bytes()
                  ).hexdigest(),
                  "sbom_sha256": hashlib.sha256(
                      (assets / "sbom.json").read_bytes()
                  ).hexdigest(),
                  "publication_authorization": {
                      "decision": authorization["decision"],
                      "version": authorization["version"],
                      "tag": authorization["tag"],
                      "authorized_targets": authorization["authorized_targets"],
                      "exact_candidate_review_receipt": authorization[
                          "exact_candidate_review_receipt"
                      ],
                      "exact_candidate_review_receipt_sha256": (
                          review_receipt_sha256
                      ),
                      "reviewed_candidate": review_receipt[
                          "reviewed_candidate"
                      ],
                      "record_sha256": hashlib.sha256(
                          authorization_path.read_bytes()
                      ).hexdigest(),
                  },
                  "qualified_review_required": True,
                  "professional_approval": False,
              }
          )
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: Python/dist/

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: Python/release-assets/

  publish-testpypi:
    name: Publish ${{ needs.validate.outputs.version }} to TestPyPI
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/structural-lib-is456
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          name: release-evidence
          path: release-assets/

      - name: Verify downloaded artifact identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("release-assets/artifact-manifest.json").read_text())
          expected = {item["filename"]: item["sha256"] for item in manifest["artifacts"]}
          actual = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir() if path.is_file()
          }
          assert actual == expected, {"expected": expected, "actual": actual}
          PY

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish ${{ needs.validate.outputs.version }} to PyPI
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/structural-lib-is456
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          name: release-evidence
          path: release-assets/

      - name: Verify downloaded artifact identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("release-assets/artifact-manifest.json").read_text())
          expected = {item["filename"]: item["sha256"] for item in manifest["artifacts"]}
          actual = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir() if path.is_file()
          }
          assert actual == expected, {"expected": expected, "actual": actual}
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [validate, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          name: release-evidence
          path: release-assets/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
