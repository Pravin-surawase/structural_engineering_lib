name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version to publish to TestPyPI'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: Python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,validation]' 'httpx>=0.27'

      - name: Resolve and verify requested version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version || '' }}
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            requested_version="${GITHUB_REF_NAME#v}"
          else
            requested_version="$MANUAL_VERSION"
          fi
          if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+a[0-9]+$ ]]; then
            echo "Invalid Alpha release version: $requested_version"
            echo "Expected PEP 440 Alpha format X.Y.ZaN (for example, 0.24.0a1)"
            exit 1
          fi
          if [[ "$requested_version" != "$package_version" ]]; then
            echo "Requested version $requested_version does not match package version $package_version"
            exit 1
          fi
          prerelease=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              classifiers = tomllib.load(stream)["project"].get("classifiers", [])

          assert "Development Status :: 3 - Alpha" in classifiers
          print("true")
          PY
          )
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify public-distribution permission
        run: python ../scripts/release.py permission-check

      - name: Verify complete footing release inclusion
        run: python ../scripts/release.py footing-inclusion-check

      - name: Run release tests
        run: python -m pytest tests -q --tb=short

  build:
    name: Build and verify distributions
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine 'cyclonedx-bom>=7,<8'
          python -m build
          python -m twine check dist/*

      - name: Verify distribution contents and record artifact identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          artifacts = sorted(path for path in dist.iterdir() if path.is_file())
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"

          forbidden = (
              "structural_lib/_migration_fixtures/",
              "structural_lib/research/",
              "structural_lib/codes/aci318/",
              "structural_lib/codes/ec2/",
              "tests/",
              "examples/",
              "scripts/",
              "docs/",
          )
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_files = sorted(archive.namelist())
              leaked = [name for name in wheel_files if name.startswith(forbidden)]
              assert not leaked, f"forbidden wheel content: {leaked}"
              clause_name = next(
                  name for name in wheel_files if name.endswith("codes/is456/clauses.json")
              )
              clause_data = json.loads(archive.read(clause_name))
              assert clause_data["metadata"]["protected_standard_text_included"] is False
              assert clause_data["metadata"]["protected_table_values_included"] is False
              serialized = json.dumps(clause_data)
              assert '"text"' not in serialized and '"data"' not in serialized

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_files = sorted(member.name for member in archive.getmembers())
              leaked = [
                  name
                  for name in sdist_files
                  if any(f"/{prefix}" in name for prefix in forbidden)
              ]
              assert not leaked, f"forbidden sdist content: {leaked}"

          release_assets = Path("release-assets")
          release_assets.mkdir(exist_ok=True)
          (release_assets / "wheel-inventory.txt").write_text(
              "\n".join(wheel_files) + "\n", encoding="utf-8"
          )
          (release_assets / "sdist-inventory.txt").write_text(
              "\n".join(sdist_files) + "\n", encoding="utf-8"
          )
          manifest = {
              "source_sha": os.environ["SOURCE_SHA"],
              "source_ref": os.environ["SOURCE_REF"],
              "artifacts": [
                  {
                      "filename": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "size_bytes": path.stat().st_size,
                  }
                  for path in artifacts
              ],
              "content_allowlist_passed": True,
              "protected_content_gate_passed": True,
              "public_distribution_permission_record": {
                  "record_id": "IS456-PUBLIC-DISTRIBUTION-001",
                  "decision": "AUTHORIZED",
                  "sha256": hashlib.sha256(
                      Path(
                          "../docs/verification/"
                          "is456-public-distribution-permission.json"
                      ).read_bytes()
                  ).hexdigest(),
              },
              "public_distribution_permission_gate_passed": True,
              "footing_release_inclusion": {
                  "record_id": "FOOT-ISO-RC-V1-RELEASE-INCLUSION",
                  "source_head": "886871aef93d9a955a3cc2fa613fe49bad589ce7",
                  "sha256": hashlib.sha256(
                      Path(
                          "../docs/verification/footing-release-inclusion.json"
                      ).read_bytes()
                  ).hexdigest(),
              },
              "footing_release_inclusion_gate_passed": True,
          }
          (release_assets / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Clean-environment UAT on the exact built wheel
        run: |
          mapfile -t wheels < <(find dist -maxdepth 1 -name '*.whl' -print)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          uat_root="$(mktemp -d)"
          test -n "$uat_root"
          python -m venv "$uat_root/venv"
          "$uat_root/venv/bin/python" -m pip install --upgrade pip
          "$uat_root/venv/bin/python" -m pip install "${wheels[0]}"
          (
            cd "$uat_root"
            "$uat_root/venv/bin/python" - <<'PY'
          from pathlib import Path
          import structural_lib
          from structural_lib.services import api
          from structural_lib.services import footing_api

          installed_path = Path(structural_lib.__file__).resolve()
          assert "site-packages" in str(installed_path), installed_path
          assert api.get_library_version()

          beam = api.design_beam_is456(
              units="IS456", b_mm=300, D_mm=500, d_mm=450,
              fck_nmm2=25, fy_nmm2=415, mu_knm=100, vu_kn=80,
          )
          column = api.design_column_axial_is456(
              fck_nmm2=25, fy_nmm2=415, Ag_mm2=160000, Asc_mm2=3200,
          )
          footing = api.check_bearing_pressure(
              Pu_kN=500, fck=25, column_b_mm=300, column_D_mm=300,
              footing_B_mm=1500, footing_L_mm=1500,
          )
          transfer = api.check_isolated_footing_load_transfer(
              Pu_kN=3000, loaded_area_A2_mm2=160000,
              effective_supporting_area_A1_mm2=640000,
              effective_supporting_area_basis="largest_frustum_1v_2h",
              effective_supporting_area_is_approved=True,
              supporting_concrete_fck_nmm2=20,
              supported_concrete_fck_nmm2=25,
              steel_fy_nmm2=415, dowel_count=8, dowel_diameter_mm=25,
              column_longitudinal_bar_diameter_mm=32,
              available_dowel_development_length_into_footing_mm=1176,
              available_dowel_development_length_into_supported_member_mm=1010,
          )
          slab = api.design_one_way_slab_is456(
              short_effective_span_mm=3000, long_effective_span_mm=7500,
              thickness_mm=150, d_mm=125,
              factored_area_load_kn_per_m2=10,
              fck_n_per_mm2=20, fy_n_per_mm2=415,
              main_bar_diameter_mm=10, main_bar_spacing_mm=250,
              distribution_bar_diameter_mm=8,
              distribution_bar_spacing_mm=250,
          )
          capabilities = api.get_supported_is456_capabilities()
          assert beam is not None and column["Pu_kN"] > 0 and footing.is_safe
          assert transfer.is_safe and slab.is_detailing_adequate
          assert callable(footing_api.design_concentric_isolated_footing_is456)
          assert {item.element for item in capabilities} == {
              "beam", "column", "isolated_footing", "solid_slab"
          }
          print(f"installed wheel UAT passed from {installed_path}")
          PY
            "$uat_root/venv/bin/python" -m structural_lib --help >/dev/null
          )

      - name: Generate and validate CycloneDX SBOM
        run: |
          mkdir -p release-assets
          cyclonedx-py environment \
            --output-file release-assets/sbom.json \
            --output-format JSON \
            --spec-version 1.6
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('release-assets/sbom.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('bomFormat') == 'CycloneDX'
          assert data.get('specVersion') == '1.6'
          assert isinstance(data.get('components'), list) and data['components']
          print(f"Validated SBOM with {len(data['components'])} components")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: Python/dist/

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: Python/release-assets/

  publish-testpypi:
    name: Publish ${{ needs.validate.outputs.version }} to TestPyPI
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/structural-lib-is456
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          name: release-evidence
          path: release-assets/

      - name: Verify downloaded artifact identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("release-assets/artifact-manifest.json").read_text())
          expected = {item["filename"]: item["sha256"] for item in manifest["artifacts"]}
          actual = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir() if path.is_file()
          }
          assert actual == expected, {"expected": expected, "actual": actual}
          PY

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish ${{ needs.validate.outputs.version }} to PyPI
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/structural-lib-is456
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          name: release-evidence
          path: release-assets/

      - name: Verify downloaded artifact identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("release-assets/artifact-manifest.json").read_text())
          expected = {item["filename"]: item["sha256"] for item in manifest["artifacts"]}
          actual = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir() if path.is_file()
          }
          assert actual == expected, {"expected": expected, "actual": actual}
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [validate, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          name: release-evidence
          path: release-assets/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
