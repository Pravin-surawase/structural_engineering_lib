name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - "Python/**"
      - "fastapi_app/**"
      - "react_app/package.json"
      - "react_app/package-lock.json"
      - "requirements*.txt"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "Python/**"
      - "fastapi_app/**"
      - "react_app/package.json"
      - "react_app/package-lock.json"
      - "requirements*.txt"
      - ".github/workflows/security.yml"
  schedule:
    # Run daily at 6 AM UTC (11:30 AM IST)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: python -m pip install 'pip-audit>=2.9,<3'

      - name: Run pip-audit
        id: pip-audit
        run: |
          set +e
          pip-audit --strict --no-deps --requirement requirements-lock.txt \
            --format json --output pip-audit-report.json
          audit_status=$?
          pip-audit --strict --no-deps --requirement requirements-lock.txt \
            --format markdown --output pip-audit-report.md || true
          exit "$audit_status"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            pip-audit-report.md
          retention-days: 30

      - name: Summarize results
        if: always()
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f pip-audit-report.md ]; then
            echo "### pip-audit Report" >> $GITHUB_STEP_SUMMARY
            cat pip-audit-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerabilities found by pip-audit" >> $GITHUB_STEP_SUMMARY
          fi

  frontend-dependency-audit:
    name: Frontend Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: react_app/package-lock.json

      - name: Install locked dependencies
        working-directory: react_app
        run: npm ci

      - name: Run npm audit
        working-directory: react_app
        run: |
          npm audit --omit=dev --json > npm-audit-report.json || true

          total=$(jq -r '.metadata.vulnerabilities.total // 0' npm-audit-report.json)
          unexpected_packages=$(jq -r '.vulnerabilities | keys[]?' npm-audit-report.json \
            | grep -Ev '^(react-router|react-router-dom)$' || true)
          unexpected_advisories=$(jq -r \
            '[.vulnerabilities[]?.via[]? | select(type == "object") | .url] | unique[]?' \
            npm-audit-report.json \
            | grep -Fvx 'https://github.com/advisories/GHSA-qwww-vcr4-c8h2' || true)
          advisory_count=$(jq -r \
            '[.vulnerabilities[]?.via[]? | select(type == "object") | .url] | unique | length' \
            npm-audit-report.json)

          if [ -n "$unexpected_packages" ] || [ -n "$unexpected_advisories" ]; then
            echo "::error::Unexpected npm vulnerability detected"
            exit 1
          fi

          if [ "$total" -gt 0 ] && [ "$advisory_count" -eq 0 ]; then
            echo "::error::npm reported vulnerabilities without an auditable advisory URL"
            exit 1
          fi

          if [ "$total" -gt 0 ]; then
            echo "::warning::Known React Router RSC-only advisory remains allowlisted; see docs/planning/dependency-security-baseline.md"
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-security-report
          path: react_app/npm-audit-report.json
          retention-days: 30

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        working-directory: Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dxf]"

      - name: Install CycloneDX
        run: |
          python -m pip install 'cyclonedx-bom>=7,<8'

      - name: Generate SBOM
        run: |
          # Generate CycloneDX SBOM in JSON format
          cyclonedx-py environment --output-format JSON --output-file sbom.json

          # Also generate in XML format for broader compatibility
          cyclonedx-py environment --output-format XML --output-file sbom.xml

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml
          retention-days: 90

      - name: SBOM Summary
        run: |
          echo "## 📦 SBOM Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Software Bill of Materials generated in CycloneDX format." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Format:** CycloneDX 1.4" >> $GITHUB_STEP_SUMMARY
          echo "- **Files:** sbom.json, sbom.xml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count components
          if command -v jq &> /dev/null && [ -f sbom.json ]; then
            COMPONENTS=$(jq '.components | length' sbom.json 2>/dev/null || echo "N/A")
            echo "- **Components:** $COMPONENTS" >> $GITHUB_STEP_SUMMARY
          fi

  bandit-scan:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bandit
        run: |
          python -m pip install bandit[toml]

      - name: Run bandit
        run: |
          bandit -r Python/structural_lib -f json -o bandit-report.json || true
          bandit -r Python/structural_lib -f txt -o bandit-report.txt || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: |
            bandit-report.json
            bandit-report.txt
          retention-days: 30

      - name: Summarize bandit results
        if: always()
        run: |
          echo "## 🔍 Bandit Static Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f bandit-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 bandit-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
