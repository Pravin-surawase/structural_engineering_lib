name: ❓ Support / Question
description: Ask a question or request help using the library
title: "[Question]: "
labels: ["question", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Need help with StructLib? Please share enough context to reproduce or understand the question.

        **Quick resources:**
        - [Product Tour](https://github.com/Pravin-surawase/structural_engineering_lib/blob/main/docs/getting-started/product-tour.md)
        - [Documentation](https://github.com/Pravin-surawase/structural_engineering_lib/tree/main/docs)
        - [API Reference](https://github.com/Pravin-surawase/structural_engineering_lib/blob/main/docs/reference/api.md)
        - [Examples](https://github.com/Pravin-surawase/structural_engineering_lib/tree/main/Python/examples)

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
      placeholder: How do I run the bundled sample through the Building Editor?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Related Component
      description: Which part of the library is this about?
      options:
        - Python library (structural_lib)
        - Command-line interface
        - FastAPI / WebSocket / SSE
        - React workbench
        - CSV import / batch design
        - 3D visualization
        - BBS / DXF / reports / BOQ
        - Installation / Setup
        - Documentation
        - General usage
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What I tried
      description: What have you already tried?
      placeholder: |
        I followed the Python quick start and then...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Your environment and what you're trying to achieve
      value: |
        - Library version: [e.g., 0.23.0]
        - Python version: [e.g., 3.11.8]
        - OS: [e.g., Windows 11]
        - Interface: [Python / CLI / FastAPI / React]
        - Use case: [brief description]
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant Output / Errors
      description: Any error messages or unexpected output
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have checked the documentation
          required: true
        - label: I have searched existing issues
          required: true
