# Pre-commit hooks for structural_engineering_lib
# Install hooks: ./scripts/python_runtime.sh -m pre_commit install --hook-type pre-commit --hook-type pre-push
# Run PR file integrity: ./scripts/python_runtime.sh -m pre_commit run --hook-stage manual --all-files

default_stages: [pre-commit]

repos:
  # Ordinary commits retain only mutation-safety checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=500']
        stages: [pre-commit]

  # Live operation safety cannot be observed by a hosted checkout.
  - repo: local
    hooks:
      - id: git-operation-guard
        name: Block unsafe Git operations while permitting a resolved merge
        entry: ./scripts/python_runtime.sh scripts/git_state.py --guard operation --allow-operation-completion
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: file-integrity-read-only
        name: Validate immutable candidate bytes without rewriting files
        entry: ./scripts/python_runtime.sh scripts/verification.py integrity --all-files
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: delivery-state-guard
        name: Block push unless the current candidate passed the delivery audit
        entry: ./scripts/python_runtime.sh scripts/session.py delivery --guard-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# Required candidate assurance runs once in the PR workflow. Formatting,
# tests, and broad checks remain explicit changed-domain or hosted gates.
