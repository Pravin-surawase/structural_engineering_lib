# Project-local efficiency defaults. The parent model and reasoning are
# deliberately unset so an explicit user selection or delegated orchestrator
# choice remains in control.
model_verbosity = "low"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"

[features]
fast_mode = false
