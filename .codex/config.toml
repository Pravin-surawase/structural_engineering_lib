# Project-local Codex defaults. Loaded only when this repository is trusted.
# Keep this file small: it is an execution policy, not general documentation.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_verbosity = "low"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"

[features]
fast_mode = false
